<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Pollution Prediction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">
            Air Pollution Prediction System
        </h2>

        <div class="row">

            <div class="col-md-6 mb-3">
                <label>Temperature</label>
                <input type="number" id="temperature" class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label>Humidity</label>
                <input type="number" id="humidity" class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label>PM2.5</label>
                <input type="number" id="pm25" class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label>PM10</label>
                <input type="number" id="pm10" class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label>NO₂</label>
                <input type="number" id="no2" class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label>SO₂</label>
                <input type="number" id="so2" class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label>CO</label>
                <input type="number" step="0.01" id="co" class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label>Distance from Industrial Area</label>
                <input type="number" id="industry" class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label>Population Density</label>
                <input type="number" id="population" class="form-control">
            </div>

        </div>

        <div class="text-center mt-3">

            <button class="btn btn-primary btn-lg" onclick="predict()">
                Predict Air Quality
            </button>

        </div>

        <div class="card mt-4 shadow p-4">

            <h3 class="text-center mb-4">
                Prediction Result
            </h3>
        
            <div class="text-center">
        
                <h2 id="prediction" class="fw-bold text-primary">
                    --
                </h2>
        
                <h5 class="mt-3">
                    Confidence :
                    <span id="confidence">--</span>
                </h5>
        
            </div>
        
            <hr>
        
            <div id="recommendationBox"
                 class="alert alert-info mt-3">
        
                <h5>Health Recommendation</h5>
        
                <p id="recommendation">
                    --
                </p>
        
            </div>

            <div class="mt-4">

                <label class="form-label">
                    Prediction Confidence
                </label>
            
                <div class="progress" style="height:30px;">
            
                    <div id="confidenceBar"
                         class="progress-bar progress-bar-striped progress-bar-animated"
                         role="progressbar"
                         style="width:0%">
                    </div>
            
                </div>
            
            </div>
        
        </div>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
